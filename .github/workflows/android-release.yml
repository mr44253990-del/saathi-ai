# 🚀 Build & Release APK — Jimi

name: Build & Release APK

on:
  # Every push to main builds a fresh APK and publishes it as a GitHub Release.
  # Tag pushes (v1.0.0) do the same and use the tag as the version name.
  push:
    branches: [main, master]
    tags:
      - "v*"
  # Manual run from the Actions tab
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.1)"
        required: false
        default: "1.0.0"
      make_release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional release signing — add these 4 secrets to the repo to get a
  # locally-signed release APK instead of the debug-signed one.
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ─────────────────────────────────────────────── 1. source
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────── 2. toolchain
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: 🐘 Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      # ─────────────────────────────────────────────── 3. versioning
      - name: 🏷️ Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.0.0"
          fi
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      # ─────────────────────────────────────────────── 4. optional signing
      - name: 🔐 Decode release keystore (if configured)
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────── 5. build
      - name: 🛠️ Build debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -PversionCode=${{ steps.ver.outputs.version_code }} \
            -PversionName=${{ steps.ver.outputs.version_name }} \
            --no-daemon --stacktrace

      - name: 🛠️ Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        run: |
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ steps.ver.outputs.version_code }} \
            -PversionName=${{ steps.ver.outputs.version_name }} \
            --no-daemon --stacktrace

      # ─────────────────────────────────────────────── 6. collect + rename
      - name: 📁 Collect APKs
        run: |
          mkdir -p out
          VN="${{ steps.ver.outputs.version_name }}"
          VC="${{ steps.ver.outputs.version_code }}"
          cp app/build/outputs/apk/debug/app-debug.apk "out/jimi-v${VN}-b${VC}-debug.apk"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/jimi-v${VN}-b${VC}-release.apk"
          fi

          echo "### 📱 Built APKS" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging out/*.apk 2>/dev/null \
              | grep -E "package:|application-label:" | head -5 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      # ─────────────────────────────────────────────── 7. artifacts
      - name: ⬆️ Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saathi-apk-${{ steps.ver.outputs.version_name }}-b${{ steps.ver.outputs.version_code }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      # ─────────────────────────────────────────────── 8. release
      - name: 🚀 Publish GitHub Release
        if: |
          (github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.make_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}-build${{ steps.ver.outputs.version_code }}
          name: Jimi v${{ steps.ver.outputs.version_name }} (build ${{ steps.ver.outputs.version_code }})
          body: |
            ## Jimi — তোমার হাতের Gemini Live সহকারী

            | | |
            |---|---|
            | Version | `${{ steps.ver.outputs.version_name }}` |
            | Build | `${{ steps.ver.outputs.version_code }}` |
            | Commit | `${{ github.sha }}` |
            | Built by | GitHub Actions |

            ### ইনস্টল করো
            1. নিচের `jimi-*.apk` ফাইলটা ফোনে ডাউনলোড করো
            2. Settings → "Install unknown apps" → ফাইল ম্যানেজার/ব্রাউজারকে অনুমতি দাও
            3. APK-তে ট্যাপ করে ইনস্টল করো

            ### প্রথমবার
            1. অ্যাপ খুলে **সব** পারমিশন দাও (SMS, কল, কন্টাক্ট, মিডিয়া)
            2. **Accessibility** চালু করো — এটাই Jimi-র হাত-পা: ট্যাপ, স্ক্রল, অ্যাপ চালানো
            3. **Overlay** অনুমতি দাও — কাজের সময় Jimi ছোট বাবলে নেমে যাবে
            4. সেটিংসে [Gemini API Key](https://aistudio.google.com/apikey) সেভ করো
            5. `"হেই Jimi"` বলে ডাকো, বা বোতামে চাপ দিয়ে বাংলায় কথা বলো 🎙️
          files: out/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────── 9. summary
      - name: ✅ Job summary
        if: always()
        run: |
          {
            echo "## Build result: ${{ job.status }}"
            echo ""
            echo "* Version: \`${{ steps.ver.outputs.version_name }}\` (code \`${{ steps.ver.outputs.version_code }}\`)"
            echo "* Signed release: \`${{ steps.keystore.outputs.signed == 'true' }}\`"
            echo "* Artifact: \`saathi-apk-${{ steps.ver.outputs.version_name }}-b${{ steps.ver.outputs.version_code }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
